services:
  - type: web
    name: parental-app
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        fromService:
          type: web
          name: parental-app
          property: port
      # Add your Supabase credentials
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Add your API keys
      - key: GEMINI_API_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false